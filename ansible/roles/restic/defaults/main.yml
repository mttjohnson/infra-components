---
# Restic role defaults

# ----- Installation -----
restic_version: "latest"
restic_github_repo: "restic/restic"
restic_binary_install_dir: "/usr/local/bin"
restic_config_dir: "/etc/restic"
restic_log_dir: "/var/log/restic"
restic_force_reinstall: false

restic_archive_url: >-
  https://github.com/{{ restic_github_repo }}/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_{{ ansible_facts['system'] | lower }}_{{ _restic_go_arch }}.bz2
restic_checksums_url: >-
  https://github.com/{{ restic_github_repo }}/releases/download/v{{ restic_version }}/SHA256SUMS
restic_checksums_sig_url: >-
  https://github.com/{{ restic_github_repo }}/releases/download/v{{ restic_version }}/SHA256SUMS.asc
restic_download_dest: "/tmp/restic_{{ restic_version }}_{{ ansible_facts['system'] | lower }}_{{ _restic_go_arch }}.bz2"
restic_checksums_local_path: "/tmp/restic_{{ restic_version }}_SHA256SUMS"
restic_checksums_sig_local_path: "/tmp/restic_{{ restic_version }}_SHA256SUMS.asc"

# ----- Release signature verification -----
# Restic signs the per-release SHA256SUMS file with the maintainer's
# PGP key. Authenticating that signature is the strongest provenance
# guarantee available short of reproducible builds. Disabling this is
# strongly discouraged for a backup tool: if the installed binary is
# tampered with, backups can be silently corrupted or exfiltrated and
# the operator may not notice until a disaster recovery, at which
# point the only known-good copy of the data is also gone.
restic_verify_signature: true

# URL serving the ASCII-armored signing key.
restic_signing_key_url: https://restic.net/gpg-key-alex.asc

# SHA256 of the bytes served at restic_signing_key_url. The role aborts
# if the fetched key doesn't match. Recompute on rotation with:
#   curl -fsSL https://restic.net/gpg-key-alex.asc | sha256sum
restic_signing_key_checksum: sha256:e4f09134173fdd60ece4454d30e38459d172f3ea9a97b32a37324b4f0515a289

# Expected primary-key fingerprint of restic's currently-active signing
# key. Acts as the operator-readable identity gate — the part you
# compare against the upstream trust source. The checksum above already
# locks the bytes; this fingerprint pin is what makes the identity
# auditable from the role defaults without having to re-fetch and
# re-hash the key.
#
# Verify restic's currently-published fingerprint:
#   https://restic.readthedocs.io/en/stable/020_installation.html
# Inspect a downloaded key locally with:
#   curl -fsSL https://restic.net/gpg-key-alex.asc \
#     | gpg --show-keys --with-fingerprint
#
# pub   rsa4096 2014-11-01 [SCESC]
#       CF8F 18F2 8445 7597 3F79  D4E1 91A6 868B D3F7 A907
# uid                      Alexander Neumann <alexander@bumpern.de>
#
# The key file at restic_signing_key_url currently bundles a legacy
# revoked primary (7BC3013F8489FADC424A07B9141138DDA3E45D66) alongside
# the active one. The role explicitly ignores revoked primaries when
# extracting fingerprints, and only the active fingerprint is asserted.
restic_signing_key_fingerprint: "CF8F18F2844575973F79D4E191A6868BD3F7A907"

# Where to stage the downloaded ASCII-armored key on the target.
restic_signing_key_local_path: "{{ restic_config_dir }}/restic-signing-key.asc"

# Dedicated GnuPG homedir used to verify SHA256SUMS signatures. Scope
# is limited to restic releases; this is not shared with the system or
# root's default keyring, so a compromise of restic's signing key
# cannot vouch for unrelated software on the host.
restic_gnupg_home: "{{ restic_config_dir }}/gnupg"

# ----- Repository -----
# Default to a local disk path; later swap for an NFS mount, S3 URL,
# rclone remote, etc. Anything restic understands as a repository URL.
restic_repository: "/data/backups"

# Create the local repository directory (and run `restic init`) on the
# remote host. Set false for repository types managed elsewhere (e.g. an
# NFS mount you provision separately, an S3 bucket created in advance).
restic_manage_local_repository_dir: true

# Owner/mode of the local repository directory (only used when the
# repository value is a local path and restic_manage_local_repository_dir
# is true).
restic_local_repository_owner: root
restic_local_repository_group: root
restic_local_repository_mode: "0700"

# ----- Password -----
# A repository password is generated on the remote host if the password
# file does not already exist. The password is never regenerated once
# created — losing it makes the backups unrecoverable.
restic_password_file: "{{ restic_config_dir }}/password"
restic_password_length: 64

# Optionally fetch the generated password file back to the control node
# so it lives somewhere other than the remote system being backed up.
# Strongly recommended for disaster recovery.
restic_fetch_password_to_control: false

# Directory on the control node where fetched password files are stored.
# Each host's password is written to
# {{ restic_control_password_dir }}/{{ inventory_hostname }}.password
# The directory is created on the control node if missing.
restic_control_password_dir: "./restic_passwords"
restic_control_password_dir_mode: "0700"
restic_control_password_file_mode: "0600"

# ----- Backend credentials / environment -----
# Extra environment variables placed in /etc/restic/env. Use this for
# backend credentials (AWS_ACCESS_KEY_ID, B2_ACCOUNT_ID, etc.) or for
# overriding restic's behaviour (RESTIC_CACHE_DIR, etc.).
# Example:
#   restic_env:
#     AWS_ACCESS_KEY_ID: "AKIA..."
#     AWS_SECRET_ACCESS_KEY: "..."
restic_env: {}

# ----- Backup contents -----
restic_backup_paths:
  - /etc
  - /home
  - /root
  - /var/log
restic_backup_excludes: []
restic_backup_exclude_files: []
restic_backup_exclude_caches: true
restic_backup_one_file_system: false
restic_backup_tags:
  - scheduled
restic_backup_extra_args: []

# ----- Retention policy -----
# Defaults: daily for a week, weekly for a month, monthly for a year,
# yearly for three years.
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12
restic_keep_yearly: 3
restic_forget_extra_args: []

# ----- Check -----
# Weekly check is metadata-only (fast). Monthly check reads a subset of
# pack data to catch on-disk corruption.
restic_check_extra_args: []
restic_check_data_subset: "10%"
restic_check_data_extra_args: []

# ----- Scheduler -----
# "systemd" (default) or "cron". Choosing systemd deploys a
# .service+.timer pair for each job; choosing cron deploys a single
# /etc/cron.d file with all jobs.
restic_scheduler: "systemd"

# ----- Systemd timer schedules -----
# OnCalendar expressions, see systemd.time(7).
restic_backup_schedule: "*-*-* 02:00:00"
restic_forget_schedule: "*-*-* 03:30:00"
restic_prune_schedule: "Sun *-*-* 04:00:00"
restic_check_schedule: "Sat *-*-* 05:00:00"
restic_check_data_schedule: "Sun *-*-01..07 06:00:00"

# Persistent=true catches up missed runs after downtime.
restic_persistent_timers: true

# Spread jitter across hosts so backups don't all hit the backend at the
# same wall-clock second. Set "" to disable.
restic_randomized_delay: "30min"

# ----- Cron schedules (used when restic_scheduler == "cron") -----
restic_cron_user: root
# Cron package name. Debian/Ubuntu use "cron"; RHEL-family use "cronie".
restic_cron_package: cron
restic_backup_cron: {minute: "0", hour: "2", day: "*", month: "*", weekday: "*"}
restic_forget_cron: {minute: "30", hour: "3", day: "*", month: "*", weekday: "*"}
restic_prune_cron: {minute: "0", hour: "4", day: "*", month: "*", weekday: "0"}
restic_check_cron: {minute: "0", hour: "5", day: "*", month: "*", weekday: "6"}
restic_check_data_cron: {minute: "0", hour: "6", day: "1-7", month: "*", weekday: "0"}

# ----- Operator runbook -----
# Render a host-tailored BACKUPS.md quick-reference into root's home so
# an operator who needs to verify or restore backups under stress has a
# single page to reach for, with the actual paths, schedules, and
# retention numbers for THIS host baked in. The role refreshes the file
# on every apply so it never drifts from the live configuration.
restic_deploy_backups_md: true
restic_backups_md_path: /root/BACKUPS.md
# Where the rendered BACKUPS.md points operators for the full guide
# (restore strategy, secondary-repo internals, troubleshooting prose).
# The on-host file is deliberately a terse copy-paste reference; the
# long-form explanations live in the role README.
restic_readme_url: https://github.com/mttjohnson/infra-components/blob/main/ansible/roles/restic/README.md

# ----- Failure notification -----
# Shell command run by the OnFailure= unit when a scheduled restic job
# fails. Leave empty to skip deploying the failure handler. Example for
# healthchecks.io:
#   restic_failure_command: "curl -fsS --retry 3 https://hc-ping.com/<uuid>/fail"
restic_failure_command: ""

# ----- Secondary repository (optional copy / replication target) -----
# Maintain a second, independent restic repository (e.g. an NFS-backed NAS
# share) kept in sync with the primary via `restic copy`. Leave empty to
# disable entirely — when unset the role behaves exactly as a single-repo
# deployment and nothing below is rendered.
#
# When set, the role:
#   - initializes the secondary on first detection with
#     `restic init --copy-chunker-params --from-repo <primary>` so dedup
#     parameters match and copies stay efficient;
#   - deploys a `restic-copy` job that replicates the primary into the
#     secondary, plus secondary forget/prune/check/check-data jobs so the
#     copy gets the same retention and integrity verification as the primary;
#   - writes a second env file (env.secondary) the secondary jobs source.
#
# The primary repository remains the canonical RESTIC_REPOSITORY for ad-hoc
# operator commands and the restic_restore role. To operate on the secondary,
# source env.secondary instead (documented in the rendered BACKUPS.md).
restic_secondary_repository: ""

# Password file for the secondary repository. Defaults to sharing the primary
# password — one secret to manage, already fetched to the control node when
# restic_fetch_password_to_control is enabled. The copy job passes this to
# restic explicitly (--from-password-file for the source side) so a shared
# password never triggers an interactive prompt that would hang under systemd.
restic_secondary_password_file: "{{ restic_password_file }}"

# Directory management for a local-path secondary. Default false: the mount
# (e.g. an Incus-attached NFS volume) already exists, and `restic init`
# creates the repository structure inside it. Ownership is deliberately NOT
# enforced here — an all_squash NFS export forces every file to the squash
# identity and rejects chown, so owner/group default to omit. restic does not
# rely on repository file ownership; confidentiality comes from the password
# (which never leaves the host's local disk), not from filesystem permissions.
restic_manage_secondary_repository_dir: false
restic_secondary_repository_owner: ~
restic_secondary_repository_group: ~
restic_secondary_repository_mode: ~

# Guard against silently backing up to the instance's local disk when the
# secondary's backing mount is absent. When true (default) the role refuses to
# initialize, and the scheduled secondary jobs refuse to run, unless the
# secondary path is a mountpoint. Set false for secondaries that are not local
# mounts (e.g. an s3:/b2:/rclone: URL).
restic_secondary_require_mountpoint: true

# Extra args appended to the `restic copy` command (e.g. snapshot filters
# like --tag or --host to replicate a subset).
restic_secondary_copy_extra_args: []

# ----- Secondary systemd timer schedules (OnCalendar) -----
# Offset after the primary windows: copy runs after the primary backup so the
# secondary sees every snapshot, then symmetric forget/prune/check trail their
# primary counterparts.
restic_secondary_copy_schedule: "*-*-* 03:00:00"
restic_secondary_forget_schedule: "*-*-* 03:45:00"
restic_secondary_prune_schedule: "Sun *-*-* 04:30:00"
restic_secondary_check_schedule: "Sat *-*-* 05:30:00"
restic_secondary_check_data_schedule: "Sun *-*-01..07 06:30:00"

# ----- Secondary cron schedules (used when restic_scheduler == "cron") -----
restic_secondary_copy_cron: {minute: "0", hour: "3", day: "*", month: "*", weekday: "*"}
restic_secondary_forget_cron: {minute: "45", hour: "3", day: "*", month: "*", weekday: "*"}
restic_secondary_prune_cron: {minute: "30", hour: "4", day: "*", month: "*", weekday: "0"}
restic_secondary_check_cron: {minute: "30", hour: "5", day: "*", month: "*", weekday: "6"}
restic_secondary_check_data_cron: {minute: "30", hour: "6", day: "1-7", month: "*", weekday: "0"}
