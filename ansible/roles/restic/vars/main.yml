---
# Map ansible architecture facts to Go architecture names used by restic release filenames
_restic_arch_map:
  i386: "386"
  x86_64: amd64
  aarch64: arm64
  armv7l: arm
  armv6l: arm

_restic_go_arch: "{{ restic_go_arch | default(_restic_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture'])) }}"

# Environment used when invoking restic from Ansible tasks (repo init,
# config check). The same data is written to /etc/restic/env for use by
# the scheduled job scripts.
_restic_runtime_env: "{{ {'RESTIC_REPOSITORY': restic_repository, 'RESTIC_PASSWORD_FILE': restic_password_file} | combine(restic_env) }}"

# Same, but targeting the optional secondary repository. Used to probe /
# initialize the secondary from Ansible tasks; mirrored into env.secondary
# for the scheduled secondary jobs.
_restic_secondary_runtime_env: "{{ {'RESTIC_REPOSITORY': restic_secondary_repository, 'RESTIC_PASSWORD_FILE': restic_secondary_password_file} | combine(restic_env) }}"

# Whether the optional secondary repository is configured.
_restic_secondary_enabled: "{{ (restic_secondary_repository | default('')) | length > 0 }}"

# The list of scheduled jobs deployed by the role. Each entry is rendered
# as a {script, .service, .timer} triple by schedule_systemd.yml and as a
# cron line by schedule_cron.yml.
#
# Per-entry keys:
#   script     - filename of the deployed script (and the .service ExecStart)
#   template   - source template to render (defaults to `script`); lets several
#                jobs reuse one template rendered to distinct filenames
#   env_file   - env file the script/unit loads (defaults to `env`); the
#                secondary jobs load `env.secondary` to target the secondary repo
#   repository - repo path the job operates on (used by the mountpoint guard)
#   require_mountpoint - when true, the job refuses to run unless `repository`
#                is a mountpoint (guards against writing to local disk)
_restic_base_jobs:
  - name: backup
    description: "Restic backup"
    script: restic-backup.sh
    systemd_schedule: "{{ restic_backup_schedule }}"
    cron: "{{ restic_backup_cron }}"
  - name: forget
    description: "Restic forget (apply retention policy)"
    script: restic-forget.sh
    systemd_schedule: "{{ restic_forget_schedule }}"
    cron: "{{ restic_forget_cron }}"
  - name: prune
    description: "Restic prune (reclaim space)"
    script: restic-prune.sh
    systemd_schedule: "{{ restic_prune_schedule }}"
    cron: "{{ restic_prune_cron }}"
  - name: check
    description: "Restic check (metadata)"
    script: restic-check.sh
    systemd_schedule: "{{ restic_check_schedule }}"
    cron: "{{ restic_check_cron }}"
  - name: check-data
    description: "Restic check (read subset of pack data)"
    script: restic-check-data.sh
    systemd_schedule: "{{ restic_check_data_schedule }}"
    cron: "{{ restic_check_data_cron }}"

# Jobs added only when a secondary repository is configured. The copy job is
# unique; the rest reuse the primary forget/prune/check templates rendered to
# distinct filenames against env.secondary, so retention and check settings
# stay identical to the primary with no second source of truth.
_restic_secondary_jobs:
  - name: copy
    description: "Restic copy (replicate primary -> secondary)"
    script: restic-copy.sh
    env_file: env.secondary
    repository: "{{ restic_secondary_repository }}"
    require_mountpoint: "{{ restic_secondary_require_mountpoint }}"
    systemd_schedule: "{{ restic_secondary_copy_schedule }}"
    cron: "{{ restic_secondary_copy_cron }}"
  - name: forget-secondary
    description: "Restic forget on secondary (apply retention policy)"
    script: restic-forget-secondary.sh
    template: restic-forget.sh
    env_file: env.secondary
    repository: "{{ restic_secondary_repository }}"
    require_mountpoint: "{{ restic_secondary_require_mountpoint }}"
    systemd_schedule: "{{ restic_secondary_forget_schedule }}"
    cron: "{{ restic_secondary_forget_cron }}"
  - name: prune-secondary
    description: "Restic prune on secondary (reclaim space)"
    script: restic-prune-secondary.sh
    template: restic-prune.sh
    env_file: env.secondary
    repository: "{{ restic_secondary_repository }}"
    require_mountpoint: "{{ restic_secondary_require_mountpoint }}"
    systemd_schedule: "{{ restic_secondary_prune_schedule }}"
    cron: "{{ restic_secondary_prune_cron }}"
  - name: check-secondary
    description: "Restic check on secondary (metadata)"
    script: restic-check-secondary.sh
    template: restic-check.sh
    env_file: env.secondary
    repository: "{{ restic_secondary_repository }}"
    require_mountpoint: "{{ restic_secondary_require_mountpoint }}"
    systemd_schedule: "{{ restic_secondary_check_schedule }}"
    cron: "{{ restic_secondary_check_cron }}"
  - name: check-data-secondary
    description: "Restic check on secondary (read subset of pack data)"
    script: restic-check-data-secondary.sh
    template: restic-check-data.sh
    env_file: env.secondary
    repository: "{{ restic_secondary_repository }}"
    require_mountpoint: "{{ restic_secondary_require_mountpoint }}"
    systemd_schedule: "{{ restic_secondary_check_data_schedule }}"
    cron: "{{ restic_secondary_check_data_cron }}"

_restic_jobs: "{{ _restic_base_jobs + (_restic_secondary_jobs if (_restic_secondary_enabled | bool) else []) }}"
