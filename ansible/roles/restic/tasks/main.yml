---
# ----- Resolve version -----

- name: Resolve latest restic version from GitHub API
  when: restic_version == "latest"
  block:
    - name: Query GitHub API for latest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/{{ restic_github_repo }}/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github.v3+json
      register: restic_latest_release
      delegate_to: localhost
      become: false
      run_once: true
      check_mode: false

    - name: Set restic_version from latest release tag
      ansible.builtin.set_fact:
        restic_version: "{{ (restic_latest_release.json.tag_name | replace('v', '')) }}"
      run_once: true

# ----- Validate scheduler choice early -----

- name: Assert restic_scheduler is supported
  ansible.builtin.assert:
    that:
      - restic_scheduler in ["systemd", "cron"]
    fail_msg: >-
      restic_scheduler must be "systemd" or "cron". Got: {{ restic_scheduler }}

# ----- Install bzip2 (needed to decompress the release binary) -----

- name: Install bzip2 (needed to decompress restic release binary)
  ansible.builtin.package:
    name: bzip2
    state: present

# ----- Check current installation -----

- name: Check if restic binary exists
  ansible.builtin.stat:
    path: "{{ restic_binary_install_dir }}/restic"
  register: _restic_binary_stat

- name: Get installed restic version
  ansible.builtin.command:
    cmd: "{{ restic_binary_install_dir }}/restic version"
  register: _restic_version_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when: _restic_binary_stat.stat.exists

- name: Set restic installation required flag
  ansible.builtin.set_fact:
    _restic_needs_install: >-
      {{ (restic_force_reinstall | bool)
         or not (_restic_binary_stat.stat.exists | bool)
         or ((_restic_version_raw | default({})).stdout | default('')
             | regex_search('[0-9]+\.[0-9]+\.[0-9]+')) != restic_version }}

# ----- Download, verify, and install binary -----

- name: Report planned installation (check mode)
  ansible.builtin.debug:
    msg: "Would install restic {{ restic_version }}"
  when: (_restic_needs_install | bool) and ansible_check_mode

# Establish provenance of the SHA256SUMS file before trusting any
# checksum it contains. Inside verify_signature.yml the role downloads
# the restic signing key (pinned by SHA256 + active-primary fingerprint),
# imports it into a dedicated keyring, downloads SHA256SUMS plus its
# .asc signature, and gpg --verify's the signature. Everything below
# this point inherits that authentication.
- name: Authenticate release SHA256SUMS via PGP signature
  ansible.builtin.include_tasks: verify_signature.yml
  when:
    - _restic_needs_install | bool
    - restic_verify_signature | bool

- name: Handle disabled signature verification
  when:
    - _restic_needs_install | bool
    - not (restic_verify_signature | bool)
  block:
    - name: Warn that restic SHA256SUMS signature verification is disabled
      ansible.builtin.debug:
        msg: >-
          WARNING: restic_verify_signature is false. The SHA256SUMS file used
          to verify the binary archive will be trusted on TLS alone, with no
          PGP authentication of the release maintainer. For a backup tool
          installed as root, this weakens supply-chain provenance. Strongly
          recommended to re-enable signature verification.

    - name: Download SHA256SUMS (unverified)
      ansible.builtin.get_url:
        url: "{{ restic_checksums_url }}"
        dest: "{{ restic_checksums_local_path }}"
        force: true
        owner: root
        group: root
        mode: "0644"
      ignore_errors: "{{ ansible_check_mode }}"

- name: Read SHA256SUMS from disk
  ansible.builtin.slurp:
    src: "{{ restic_checksums_local_path }}"
  register: _restic_sha256sums_slurp
  when: _restic_needs_install | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Extract expected checksum for downloaded archive
  ansible.builtin.set_fact:
    restic_expected_checksum: >-
      {{ (_restic_sha256sums_slurp.content | ansible.builtin.b64decode)
         | regex_search('^([0-9a-f]+)\s+' + (restic_download_dest | basename | regex_escape) + '\s*$', '\1', multiline=True)
         | first }}
  when:
    - _restic_needs_install | bool
    - _restic_sha256sums_slurp.content is defined

- name: Download restic binary archive with checksum
  ansible.builtin.get_url:
    url: "{{ restic_archive_url }}"
    dest: "{{ restic_download_dest }}"
    checksum: "sha256:{{ restic_expected_checksum }}"
    mode: "0644"
  when: _restic_needs_install | bool
  ignore_errors: "{{ ansible_check_mode }}"

  # The release artifact is a single bzip2-compressed binary (not a tar
  # archive), so unarchive does not apply. --keep preserves the .bz2 for
  # idempotent re-runs; --force overwrites a stale decompressed copy.
- name: Decompress restic binary
  ansible.builtin.command:
    cmd: "bunzip2 --keep --force {{ restic_download_dest }}"
  when: _restic_needs_install | bool
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install restic binary
  ansible.builtin.copy:
    src: "{{ restic_download_dest | regex_replace('\\.bz2$', '') }}"
    dest: "{{ restic_binary_install_dir }}/restic"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: _restic_needs_install | bool
  ignore_errors: "{{ ansible_check_mode }}"

# ----- Config directory & log directory -----

- name: Create restic config directory
  ansible.builtin.file:
    path: "{{ restic_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create restic log directory
  ansible.builtin.file:
    path: "{{ restic_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# ----- Password file -----
#
# Establishment order (see RECOVERY.md):
#   1. If the host already has a password, keep it.
#   2. Else if the control node holds one for this host and seeding is enabled,
#      reseed the host from it so we reuse the existing key and can read existing
#      backups (the rebuild / disaster-recovery path).
#   3. Else generate a fresh password (genuine first deployment).
# The fetch-back to the control node is write-once so a good key is never
# clobbered.

- name: Check if restic password file exists on the host
  ansible.builtin.stat:
    path: "{{ restic_password_file }}"
  register: _restic_password_file_stat

- name: Check for a control-node password copy for this host
  ansible.builtin.stat:
    path: "{{ restic_control_password_file }}"
  register: _restic_control_password_stat
  delegate_to: localhost
  become: false

# ----- Recovery signals (password-independent; see RECOVERY.md) -----
# A restic repository's structure (the `config` file) is visible without the
# password, so these stats detect an existing repository even when no key is
# available — the worst-case rebuild where the control-node key was also lost.

- name: Probe whether the primary repository already exists
  ansible.builtin.stat:
    path: "{{ restic_repository }}/config"
  register: _restic_primary_config_stat
  when: restic_repository.startswith('/')

- name: Probe whether the secondary repository already exists
  ansible.builtin.stat:
    path: "{{ restic_secondary_repository }}/config"
  register: _restic_secondary_config_stat
  when:
    - _restic_secondary_enabled | bool
    - restic_secondary_repository.startswith('/')

# ----- Volume sentinel (see RECOVERY.md) -----
# Recognise the repository's backing volume across rebuilds.

- name: Stat the on-host volume sentinel
  ansible.builtin.stat:
    path: "{{ restic_volume_sentinel_path }}"
  register: _restic_host_sentinel_stat
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')

- name: Read the on-host volume sentinel id
  ansible.builtin.slurp:
    src: "{{ restic_volume_sentinel_path }}"
  register: _restic_host_sentinel_slurp
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')
    - _restic_host_sentinel_stat.stat.exists | default(false) | bool

- name: Stat the control-node volume sentinel pin
  ansible.builtin.stat:
    path: "{{ restic_control_volume_sentinel_file }}"
  register: _restic_control_sentinel_stat
  delegate_to: localhost
  become: false
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')

- name: Read the control-node volume sentinel pin
  ansible.builtin.slurp:
    src: "{{ restic_control_volume_sentinel_file }}"
  register: _restic_control_sentinel_slurp
  delegate_to: localhost
  become: false
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')
    - _restic_control_sentinel_stat.stat.exists | default(false) | bool

- name: Compute recovery signals
  ansible.builtin.set_fact:
    restic_host_password_present: "{{ _restic_password_file_stat.stat.exists | bool }}"
    restic_control_password_present: "{{ _restic_control_password_stat.stat.exists | bool }}"
    restic_primary_repo_exists: "{{ (_restic_primary_config_stat.stat.exists | default(false)) | bool }}"
    restic_secondary_repo_exists: "{{ (_restic_secondary_config_stat.stat.exists | default(false)) | bool }}"
    restic_sentinel_host_present: "{{ _restic_host_sentinel_stat.stat.exists | default(false) | bool }}"
    restic_sentinel_pinned: "{{ _restic_control_sentinel_stat.stat.exists | default(false) | bool }}"
    restic_host_sentinel_id: "{{ (_restic_host_sentinel_slurp.content | b64decode | trim) if (_restic_host_sentinel_slurp.content is defined) else '' }}"
    restic_control_sentinel_id: "{{ (_restic_control_sentinel_slurp.content | b64decode | trim) if (_restic_control_sentinel_slurp.content is defined) else '' }}"
    restic_fresh_start_active: >-
      {{ ((restic_force_fresh_start | default('')) | length > 0)
         and ((restic_force_fresh_start | default('')) == inventory_hostname) }}

- name: Compute sentinel status
  ansible.builtin.set_fact:
    # A different volume is mounted than expected (both present, ids differ).
    restic_sentinel_mismatch: >-
      {{ restic_sentinel_host_present and restic_sentinel_pinned
         and (restic_host_sentinel_id != restic_control_sentinel_id) }}
    # The volume looks freshly rebuilt / unmounted (pinned but no on-host id).
    restic_sentinel_absent_pinned: >-
      {{ restic_sentinel_pinned and not restic_sentinel_host_present }}

- name: Compute recovery_expected
  ansible.builtin.set_fact:
    # Any one of these indicates a prior backup was established for this host.
    restic_recovery_expected: >-
      {{ restic_host_password_present or restic_control_password_present
         or restic_primary_repo_exists or restic_secondary_repo_exists
         or restic_sentinel_absent_pinned }}
    # A usable key exists if the host has one or the control node holds a copy.
    restic_have_usable_key: "{{ restic_host_password_present or restic_control_password_present }}"

# Hard stop: a DIFFERENT volume is mounted than the one pinned for this host.
# Unambiguous (both ids present and differ) — refuse rather than operate on the
# wrong disk. Override with restic_force_fresh_start to adopt the new volume.
- name: Fail when a different data volume is mounted than expected (real run)
  ansible.builtin.fail:
    msg: |
      The data volume mounted at {{ restic_repository | dirname }} does not match the
      volume pinned for this host:
        on-host sentinel {{ restic_volume_sentinel_path }}: {{ restic_host_sentinel_id }}
        control-node pin {{ restic_control_volume_sentinel_file }}: {{ restic_control_sentinel_id }}
      Refusing to operate on the wrong disk. If this is an intentional replacement,
      set restic_force_fresh_start={{ inventory_hostname }} to adopt it.
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_sentinel_mismatch | bool
    - not (restic_fresh_start_active | bool)
    - not ansible_check_mode

- name: Warn on volume sentinel anomaly (check mode / rebuilt-looking volume)
  ansible.builtin.debug:
    msg: >-
      {% if restic_sentinel_mismatch %}WARNING: a real run WOULD FAIL — a different data
      volume is mounted than pinned (host={{ restic_host_sentinel_id }},
      pin={{ restic_control_sentinel_id }}).{% elif restic_sentinel_absent_pinned %}NOTE:
      volume sentinel pinned but absent on host — the backing volume at
      {{ restic_repository | dirname }} looks freshly rebuilt or unmounted; recovery is
      engaged. If it is actually UNMOUNTED, enable restic_require_mountpoint so backups
      don't write to the root disk.{% else %}volume sentinel ok{% endif %}
  when:
    - restic_volume_sentinel_enabled | bool
    - (restic_sentinel_mismatch | bool) or (restic_sentinel_absent_pinned | bool)

# Fail-early hard stop: an initialized repository exists but no password is
# available to read it. Generating a new key here would orphan the existing
# backups, and `restic init` would refuse over an existing config. Not bypassed
# by restic_force_fresh_start — the operator must recover the key (or remove the
# repositories) deliberately.
- name: Fail early when a repository exists but no password is available (real run)
  ansible.builtin.fail:
    msg: |
      An initialized restic repository exists but no password is available to read it:
        host key   {{ restic_password_file }}: {{ 'present' if restic_host_password_present else 'MISSING' }}
        control key {{ restic_control_password_file }}: {{ 'present' if restic_control_password_present else 'MISSING' }}
        primary repo {{ restic_repository }}: {{ 'present' if restic_primary_repo_exists else 'absent' }}
        secondary repo {{ restic_secondary_repository | default('(none)') }}: {{ 'present' if restic_secondary_repo_exists else 'absent' }}
      Refusing to generate a new password or initialize over the existing repository —
      that would orphan the existing backups. Recover the control-node password copy
      from your off-host secret store into {{ restic_control_dir }}/ and re-run.
  when:
    - restic_primary_repo_exists or restic_secondary_repo_exists
    - not restic_have_usable_key
    - not ansible_check_mode

- name: Warn when a repository exists but no password is available (check mode)
  ansible.builtin.debug:
    msg: >-
      WARNING: a real run WOULD FAIL here — an initialized restic repository exists
      (primary={{ restic_primary_repo_exists }}, secondary={{ restic_secondary_repo_exists }})
      but no password is available (host={{ restic_host_password_present }},
      control={{ restic_control_password_present }}). Recover the control-node key and re-run.
  when:
    - restic_primary_repo_exists or restic_secondary_repo_exists
    - not restic_have_usable_key
    - ansible_check_mode

- name: Compute password-establishment plan
  ansible.builtin.set_fact:
    # Reseed from control when the host has none and a control copy exists,
    # unless a deliberate re-key (restic_allow_new_password) is requested.
    _restic_will_seed_password: >-
      {{ (not _restic_password_file_stat.stat.exists)
         and (_restic_control_password_stat.stat.exists | bool)
         and (restic_seed_password_from_control | bool)
         and not (restic_allow_new_password | bool) }}
    # Generate when the host has none and we are not seeding from control (no
    # control copy, seeding disabled, or an explicit re-key).
    _restic_will_generate_password: >-
      {{ (not _restic_password_file_stat.stat.exists)
         and not ((_restic_control_password_stat.stat.exists | bool)
                  and (restic_seed_password_from_control | bool)
                  and not (restic_allow_new_password | bool)) }}

- name: Seed restic password from the control node (rebuild / recovery)
  ansible.builtin.copy:
    src: "{{ restic_control_password_file }}"
    dest: "{{ restic_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: _restic_will_seed_password | bool

- name: Generate new restic repository password
  ansible.builtin.shell:
    cmd: |
      LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c {{ restic_password_length }}
  no_log: true
  register: _restic_password_gen
  check_mode: false
  changed_when: false
  when: _restic_will_generate_password | bool

- name: Write restic password file
  ansible.builtin.copy:
    content: "{{ _restic_password_gen.stdout }}\n"
    dest: "{{ restic_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: _restic_will_generate_password | bool

# ----- Optionally copy password file back to the control node (write-once) -----

- name: Save restic password file to control node
  when: restic_fetch_password_to_control | bool
  block:
    - name: Ensure control-node state directory exists
      ansible.builtin.file:
        path: "{{ restic_control_dir }}"
        state: directory
        mode: "{{ restic_control_dir_mode }}"
      delegate_to: localhost
      become: false
      run_once: true

    # Archive the existing control-node copy before a deliberate re-key
    # overwrites it, so the old key (and access to any backups it still
    # protects) is never destroyed.
    - name: Archive existing control-node password before re-key
      ansible.builtin.copy:
        src: "{{ restic_control_password_file }}"
        dest: "{{ restic_control_password_file }}.{{ ansible_facts['date_time']['iso8601_basic_short'] | default('rekey') }}.bak"
        remote_src: true
        mode: "{{ restic_control_password_file_mode }}"
      delegate_to: localhost
      become: false
      when:
        - restic_allow_new_password | bool
        - _restic_will_generate_password | bool
        - _restic_control_password_stat.stat.exists | bool
      ignore_errors: "{{ ansible_check_mode }}"

    # Fetch when no control-node copy exists yet (write-once, so a good key can
    # never be clobbered), or when a re-key generated a new one (the old copy was
    # archived just above). See RECOVERY.md.
    - name: Fetch restic password file to control node
      ansible.builtin.fetch:
        src: "{{ restic_password_file }}"
        dest: "{{ restic_control_password_file }}"
        flat: true
      when: >-
        (not (_restic_control_password_stat.stat.exists | bool))
        or ((restic_allow_new_password | bool) and (_restic_will_generate_password | bool))
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Tighten permissions on fetched password file
      ansible.builtin.file:
        path: "{{ restic_control_password_file }}"
        mode: "{{ restic_control_password_file_mode }}"
      delegate_to: localhost
      become: false
      when: >-
        (not (_restic_control_password_stat.stat.exists | bool))
        or ((restic_allow_new_password | bool) and (_restic_will_generate_password | bool))
      ignore_errors: "{{ ansible_check_mode }}"

# ----- Environment file (RESTIC_REPOSITORY + RESTIC_PASSWORD_FILE + backend creds) -----

- name: Deploy restic environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ restic_config_dir }}/env"
    owner: root
    group: root
    mode: "0600"

# ----- Optional exclude file -----

- name: Deploy restic exclude file
  ansible.builtin.template:
    src: excludes.j2
    dest: "{{ restic_config_dir }}/excludes"
    owner: root
    group: root
    mode: "0640"
  when: restic_backup_excludes | length > 0

# ----- Local repository directory & init -----

- name: Manage local repository directory
  when:
    - restic_manage_local_repository_dir | bool
    - restic_repository.startswith('/')
  ansible.builtin.file:
    path: "{{ restic_repository }}"
    state: directory
    owner: "{{ restic_local_repository_owner }}"
    group: "{{ restic_local_repository_group }}"
    mode: "{{ restic_local_repository_mode }}"

# Re-stat the binary so the cat-config / init tasks below correctly
# reflect post-install state on a fresh remote (in check mode the binary
# is still absent, which the next tasks handle).
- name: Re-check restic binary after install
  ansible.builtin.stat:
    path: "{{ restic_binary_install_dir }}/restic"
  register: _restic_binary_post_install

- name: Check if restic repository is already initialized
  ansible.builtin.command:
    cmd: "{{ restic_binary_install_dir }}/restic cat config"
  environment: "{{ _restic_runtime_env }}"
  register: _restic_cat_config
  changed_when: false
  failed_when: false
  check_mode: false
  when: _restic_binary_post_install.stat.exists

- name: Initialize restic repository
  ansible.builtin.command:
    cmd: "{{ restic_binary_install_dir }}/restic init"
  environment: "{{ _restic_runtime_env }}"
  when:
    - _restic_binary_post_install.stat.exists
    - (_restic_cat_config | default({})).rc | default(1) != 0
  ignore_errors: "{{ ansible_check_mode }}"

- name: Report planned repository initialization (check mode, no binary yet)
  ansible.builtin.debug:
    msg: "Would initialize restic repository at {{ restic_repository }}"
  when:
    - ansible_check_mode
    - not _restic_binary_post_install.stat.exists

# ----- Optional secondary repository (copy / replication target) -----
# Initialized on first detection with chunker params copied from the primary
# so `restic copy` deduplicates efficiently. The primary env file above is
# left untouched — the secondary is a separate env file the copy / secondary
# maintenance jobs source.

- name: Configure secondary restic repository
  when: _restic_secondary_enabled | bool
  block:
    - name: Deploy secondary restic environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ restic_config_dir }}/env.secondary"
        owner: root
        group: root
        mode: "0600"
      vars:
        _restic_env_repository: "{{ restic_secondary_repository }}"
        _restic_env_password_file: "{{ restic_secondary_password_file }}"

    # Ownership is intentionally not enforced (defaults are null -> omit): an
    # all_squash NFS export forces the squash identity and rejects chown.
    - name: Manage secondary local repository directory
      when:
        - restic_manage_secondary_repository_dir | bool
        - restic_secondary_repository.startswith('/')
      ansible.builtin.file:
        path: "{{ restic_secondary_repository }}"
        state: directory
        owner: "{{ restic_secondary_repository_owner | default(omit, true) }}"
        group: "{{ restic_secondary_repository_group | default(omit, true) }}"
        mode: "{{ restic_secondary_repository_mode | default(omit, true) }}"

    # Guard: refuse to initialize a repo on local disk when the backing mount
    # is missing. mountpoint is read-only and side-effect free.
    - name: Probe secondary repository mountpoint
      ansible.builtin.command:
        cmd: "mountpoint -q {{ restic_secondary_repository }}"
      register: _restic_secondary_mountpoint
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - restic_secondary_require_mountpoint | bool
        - restic_secondary_repository.startswith('/')

    - name: Fail when secondary repository mount is missing (real run)
      ansible.builtin.fail:
        msg: >-
          Secondary restic repository {{ restic_secondary_repository }} is not a
          mountpoint. Refusing to initialize a repository on local disk. Mount
          the backing storage, or set restic_secondary_require_mountpoint=false
          to override.
      when:
        - restic_secondary_require_mountpoint | bool
        - restic_secondary_repository.startswith('/')
        - (_restic_secondary_mountpoint.rc | default(0)) != 0
        - not ansible_check_mode

    - name: Warn when secondary repository mount is missing (check mode)
      ansible.builtin.debug:
        msg: >-
          WARNING: secondary repository {{ restic_secondary_repository }} is not
          a mountpoint. A real run would refuse to initialize here.
      when:
        - restic_secondary_require_mountpoint | bool
        - restic_secondary_repository.startswith('/')
        - (_restic_secondary_mountpoint.rc | default(0)) != 0
        - ansible_check_mode

    - name: Check if secondary restic repository is already initialized
      ansible.builtin.command:
        cmd: "{{ restic_binary_install_dir }}/restic cat config"
      environment: "{{ _restic_secondary_runtime_env }}"
      register: _restic_secondary_cat_config
      changed_when: false
      failed_when: false
      check_mode: false
      when: _restic_binary_post_install.stat.exists

    - name: Initialize secondary restic repository (chunker params from primary)
      ansible.builtin.command:
        cmd: >-
          {{ restic_binary_install_dir }}/restic init
          --copy-chunker-params
          --from-repo {{ restic_repository }}
          --from-password-file {{ restic_password_file }}
      environment: "{{ _restic_secondary_runtime_env }}"
      when:
        - _restic_binary_post_install.stat.exists
        - (_restic_secondary_cat_config | default({})).rc | default(1) != 0
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Report planned secondary repository initialization (check mode, no binary yet)
      ansible.builtin.debug:
        msg: "Would initialize secondary restic repository at {{ restic_secondary_repository }}"
      when:
        - ansible_check_mode
        - not _restic_binary_post_install.stat.exists

# ----- Volume sentinel write (only once the volume is confirmed present) -----
# Written after init so the repo's `config` confirms the correct volume is
# mounted (we don't stamp a sentinel onto an unmounted root disk). On a rebuilt
# volume the existing control pin is adopted; on a true first deploy a fresh id
# is generated and pinned to the control node.

- name: Re-check primary repository presence after init
  ansible.builtin.stat:
    path: "{{ restic_repository }}/config"
  register: _restic_primary_config_post
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')

- name: Generate a new volume sentinel id (first deploy, none pinned)
  ansible.builtin.command:
    cmd: cat /proc/sys/kernel/random/uuid
  register: _restic_new_sentinel_uuid
  changed_when: false
  check_mode: false
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')
    - not (restic_sentinel_host_present | bool)
    - not (restic_sentinel_pinned | bool)
    - _restic_primary_config_post.stat.exists | default(false) | bool

- name: Determine volume sentinel id to write
  ansible.builtin.set_fact:
    _restic_sentinel_id_to_write: >-
      {{ restic_control_sentinel_id if (restic_sentinel_pinned | bool)
         else (_restic_new_sentinel_uuid.stdout | default('') | trim) }}
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')

- name: Write the on-host volume sentinel
  ansible.builtin.copy:
    content: "{{ _restic_sentinel_id_to_write }}\n"
    dest: "{{ restic_volume_sentinel_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')
    - not (restic_sentinel_host_present | bool)
    - _restic_primary_config_post.stat.exists | default(false) | bool
    - (_restic_sentinel_id_to_write | default('')) | length > 0

- name: Pin the volume sentinel id to the control node
  ansible.builtin.copy:
    content: "{{ _restic_sentinel_id_to_write }}\n"
    dest: "{{ restic_control_volume_sentinel_file }}"
    mode: "{{ restic_control_state_file_mode }}"
  delegate_to: localhost
  become: false
  when:
    - restic_volume_sentinel_enabled | bool
    - restic_repository.startswith('/')
    - not (restic_sentinel_pinned | bool)
    - (_restic_sentinel_id_to_write | default('')) | length > 0

# ----- Repository identity pinning -----
# Record each repository's `cat config` id on the control node (write-once) and
# warn (or fail, when strict) if a live id later differs from its pin.

- name: Compute live repository ids
  ansible.builtin.set_fact:
    _restic_primary_live_id: >-
      {{ ((_restic_cat_config.stdout | default('')) | from_json).id
         if (((_restic_cat_config.rc | default(1)) == 0)
             and ((_restic_cat_config.stdout | default('')) | length > 0))
         else '' }}
    _restic_secondary_live_id: >-
      {{ ((_restic_secondary_cat_config.stdout | default('')) | from_json).id
         if ((_restic_secondary_cat_config is defined)
             and ((_restic_secondary_cat_config.rc | default(1)) == 0)
             and ((_restic_secondary_cat_config.stdout | default('')) | length > 0))
         else '' }}
  when: restic_repo_id_pin_enabled | bool

- name: Stat control-node primary repo id pin
  ansible.builtin.stat:
    path: "{{ restic_control_primary_repo_id_file }}"
  register: _restic_primary_pin_stat
  delegate_to: localhost
  become: false
  when: restic_repo_id_pin_enabled | bool

- name: Read control-node primary repo id pin
  ansible.builtin.slurp:
    src: "{{ restic_control_primary_repo_id_file }}"
  register: _restic_primary_pin_slurp
  delegate_to: localhost
  become: false
  when:
    - restic_repo_id_pin_enabled | bool
    - _restic_primary_pin_stat.stat.exists | default(false) | bool

- name: Stat control-node secondary repo id pin
  ansible.builtin.stat:
    path: "{{ restic_control_secondary_repo_id_file }}"
  register: _restic_secondary_pin_stat
  delegate_to: localhost
  become: false
  when:
    - restic_repo_id_pin_enabled | bool
    - _restic_secondary_enabled | bool

- name: Read control-node secondary repo id pin
  ansible.builtin.slurp:
    src: "{{ restic_control_secondary_repo_id_file }}"
  register: _restic_secondary_pin_slurp
  delegate_to: localhost
  become: false
  when:
    - restic_repo_id_pin_enabled | bool
    - _restic_secondary_enabled | bool
    - _restic_secondary_pin_stat.stat.exists | default(false) | bool

- name: Detect repository identity mismatch
  ansible.builtin.set_fact:
    _restic_primary_pinned_id: "{{ (_restic_primary_pin_slurp.content | b64decode | trim) if (_restic_primary_pin_slurp.content is defined) else '' }}"
    _restic_secondary_pinned_id: "{{ (_restic_secondary_pin_slurp.content | b64decode | trim) if (_restic_secondary_pin_slurp.content is defined) else '' }}"
  when: restic_repo_id_pin_enabled | bool

- name: Compute repository identity mismatch flags
  ansible.builtin.set_fact:
    _restic_primary_id_mismatch: >-
      {{ ((_restic_primary_pinned_id | length) > 0) and ((_restic_primary_live_id | length) > 0)
         and (_restic_primary_pinned_id != _restic_primary_live_id) }}
    _restic_secondary_id_mismatch: >-
      {{ ((_restic_secondary_pinned_id | length) > 0) and ((_restic_secondary_live_id | length) > 0)
         and (_restic_secondary_pinned_id != _restic_secondary_live_id) }}
  when: restic_repo_id_pin_enabled | bool

- name: Fail on repository identity mismatch (strict, real run)
  ansible.builtin.fail:
    msg: |
      restic repository identity differs from the pinned value (pointed at a different
      or re-initialized repository than before):
      {% if _restic_primary_id_mismatch %}  primary: pinned {{ _restic_primary_pinned_id }} != live {{ _restic_primary_live_id }}
      {% endif %}{% if _restic_secondary_id_mismatch %}  secondary: pinned {{ _restic_secondary_pinned_id }} != live {{ _restic_secondary_live_id }}
      {% endif %}
  when:
    - restic_repo_id_pin_enabled | bool
    - restic_repo_id_pin_strict | bool
    - (_restic_primary_id_mismatch | bool) or (_restic_secondary_id_mismatch | bool)
    - not ansible_check_mode

- name: Warn on repository identity mismatch
  ansible.builtin.debug:
    msg: >-
      WARNING: restic repository identity differs from the pinned value —
      primary {{ ('MISMATCH (pinned ' ~ _restic_primary_pinned_id ~ ' != live ' ~ _restic_primary_live_id ~ ')') if _restic_primary_id_mismatch else 'ok' }};
      secondary {{ ('MISMATCH (pinned ' ~ _restic_secondary_pinned_id ~ ' != live ' ~ _restic_secondary_live_id ~ ')') if _restic_secondary_id_mismatch else 'ok' }}.
      {% if restic_repo_id_pin_strict and ansible_check_mode %}A real run with restic_repo_id_pin_strict would FAIL here.{% endif %}
  when:
    - restic_repo_id_pin_enabled | bool
    - (_restic_primary_id_mismatch | bool) or (_restic_secondary_id_mismatch | bool)

- name: Pin primary repository id to the control node (write-once)
  ansible.builtin.copy:
    content: "{{ _restic_primary_live_id }}\n"
    dest: "{{ restic_control_primary_repo_id_file }}"
    mode: "{{ restic_control_state_file_mode }}"
  delegate_to: localhost
  become: false
  when:
    - restic_repo_id_pin_enabled | bool
    - (_restic_primary_live_id | length) > 0
    - not (_restic_primary_pin_stat.stat.exists | default(false) | bool)

- name: Pin secondary repository id to the control node (write-once)
  ansible.builtin.copy:
    content: "{{ _restic_secondary_live_id }}\n"
    dest: "{{ restic_control_secondary_repo_id_file }}"
    mode: "{{ restic_control_state_file_mode }}"
  delegate_to: localhost
  become: false
  when:
    - restic_repo_id_pin_enabled | bool
    - _restic_secondary_enabled | bool
    - (_restic_secondary_live_id | length) > 0
    - not (_restic_secondary_pin_stat.stat.exists | default(false) | bool)

# ----- Deploy backup / forget / prune / check scripts -----

- name: Deploy restic job scripts
  ansible.builtin.template:
    src: "{{ (item.template | default(item.script)) }}.j2"
    dest: "{{ restic_config_dir }}/{{ item.script }}"
    owner: root
    group: root
    mode: "0750"
  loop: "{{ _restic_jobs }}"
  loop_control:
    label: "{{ item.script }}"

# ----- Hand off to the chosen scheduler -----

- name: Configure systemd timers
  ansible.builtin.include_tasks: schedule_systemd.yml
  when: restic_scheduler == "systemd"

- name: Configure cron jobs
  ansible.builtin.include_tasks: schedule_cron.yml
  when: restic_scheduler == "cron"

# ----- Operator runbook -----

- name: Deploy operator runbook to {{ restic_backups_md_path }}
  ansible.builtin.template:
    src: BACKUPS.md.j2
    dest: "{{ restic_backups_md_path }}"
    owner: root
    group: root
    mode: "0600"
  when: restic_deploy_backups_md | bool
