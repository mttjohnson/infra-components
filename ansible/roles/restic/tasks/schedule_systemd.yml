---
# Deploys a .service + .timer pair per restic job from _restic_jobs.
# Also removes any /etc/cron.d/restic file left from a previous run with
# restic_scheduler == "cron" so the two schedulers don't double-fire.

- name: Remove stale cron schedule (if switching scheduler)
  ansible.builtin.file:
    path: /etc/cron.d/restic
    state: absent

- name: Deploy restic systemd service units
  ansible.builtin.template:
    src: restic-job.service.j2
    dest: "/etc/systemd/system/restic-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _restic_jobs }}"
  loop_control:
    label: "restic-{{ item.name }}.service"
  notify: Reload systemd

- name: Deploy restic systemd timer units
  ansible.builtin.template:
    src: restic-job.timer.j2
    dest: "/etc/systemd/system/restic-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _restic_jobs }}"
  loop_control:
    label: "restic-{{ item.name }}.timer"
  notify: Reload systemd

- name: Deploy restic failure handler service
  when: restic_failure_command | length > 0
  ansible.builtin.template:
    src: restic-backup-failure.service.j2
    dest: /etc/systemd/system/restic-backup-failure.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Remove restic failure handler service when disabled
  when: restic_failure_command | length == 0
  ansible.builtin.file:
    path: /etc/systemd/system/restic-backup-failure.service
    state: absent
  notify: Reload systemd

- name: Ensure handlers run before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable and start restic timers
  ansible.builtin.systemd_service:
    name: "restic-{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ _restic_jobs }}"
  loop_control:
    label: "restic-{{ item.name }}.timer"
  ignore_errors: "{{ ansible_check_mode }}"
