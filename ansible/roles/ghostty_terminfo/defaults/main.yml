---
# Where to source the xterm-ghostty terminfo entry from. One of:
#   auto             - Prefer distro packaging. If ncurses-term ships
#                      x/xterm-ghostty, the role is a no-op beyond ensuring
#                      the packages are installed. If it only ships g/ghostty
#                      (current upstream ncurses naming), the role symlinks
#                      x/xterm-ghostty -> ../g/ghostty so TERM=xterm-ghostty
#                      resolves. Falls back to extract_from_deb if neither
#                      name is present.
#   distro           - Same detection as auto, but does NOT fall back. Fails
#                      with a clear message if the installed ncurses-term
#                      provides neither xterm-ghostty nor ghostty.
#   extract_from_deb - Always pull the entry from the Ghostty .deb published
#                      by github.com/mkasberg/ghostty-ubuntu, even if the
#                      distro provides one. Useful for getting a newer
#                      Ghostty-authored definition than the distro ships.
ghostty_terminfo_source: "auto"

# mkasberg/ghostty-ubuntu release tag pulled when extract_from_deb is
# selected. Tag naming convention: <ghostty-version>-<deb-revision>-ppa<n>,
# e.g. "1.3.1-0-ppa2" wraps upstream Ghostty 1.3.1.
ghostty_terminfo_deb_release: "1.3.1-0-ppa2"

# Which .deb variant to fetch. The compiled xterm-ghostty file inside is
# byte-identical across every arch/ubuntu-version variant of a given
# release, so a single canonical choice serves all targets. The amd64_24.04
# variant is chosen because it's the smallest commonly-available URL that
# the maintainer is virtually guaranteed to keep publishing.
ghostty_terminfo_deb_variant: "amd64_24.04"

# Computed .deb filename. The release tag uses dashes throughout
# ("1.3.1-0-ppa2"); the filename's version segment replaces the last dash
# with a dot ("1.3.1-0.ppa2"). The regex below performs that substitution.
ghostty_terminfo_deb_filename: "ghostty_{{ ghostty_terminfo_deb_release | regex_replace('-([^-]+)$', '.\\1') }}_{{ ghostty_terminfo_deb_variant }}.deb"

# Full download URL. Override for internal mirrors.
ghostty_terminfo_deb_url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/{{ ghostty_terminfo_deb_release }}/{{ ghostty_terminfo_deb_filename }}"

# SHA256 of the .deb at ghostty_terminfo_deb_url, in "sha256:..." form.
# Update alongside ghostty_terminfo_deb_release. See README for how to
# recompute when bumping the version.
ghostty_terminfo_deb_checksum: "sha256:478d440153ef544426418efc7d6d8901715359f452c46be29071901a94b8cd47"

# Versioned staging directory where the .deb is downloaded and the
# extracted terminfo file is held. Versioning the path means a release bump
# triggers a fresh download rather than overwriting in place. Cleaned up at
# the end of the role.
ghostty_terminfo_staging_dir: "/var/cache/ansible-ghostty-terminfo/{{ ghostty_terminfo_deb_release }}"

# Final install paths.
ghostty_terminfo_compiled_path: "/usr/share/terminfo/x/xterm-ghostty"
