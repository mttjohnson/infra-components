---
certbot_email: admin@example.com

certbot_generate_and_issue_cert: false
certbot_cert_access_group: cert-access
certbot_domains: "{{ acme_dns_reg_cert_domains }}"

# Opt-in: relocate /etc/letsencrypt onto a separately attached volume by
# moving any existing contents to certbot_custom_data_dir and replacing
# /etc/letsencrypt with a symlink pointing at it.
certbot_relocate_data_dir: false
certbot_custom_data_dir: /data/letsencrypt
