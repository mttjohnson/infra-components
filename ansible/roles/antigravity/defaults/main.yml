---
# Set to true to force reinstall even if the CLI is already present
antigravity_force_reinstall: false

# User details for the non-privileged installation
antigravity_user: "appuser" # Replace with your target username
antigravity_group: "appuser"

# System dependencies required before running the install script
antigravity_dependencies:
  - curl
  - bash
 
# Local directory where the Antigravity installer puts the 'agy' binary
antigravity_bin_dir: "/home/{{ antigravity_user }}/.local/bin"

# Official script endpoint verified from the documentation
antigravity_installer_url: "https://antigravity.google/cli/install.sh"
