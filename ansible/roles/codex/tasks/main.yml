---
- name: Install system package dependencies
  ansible.builtin.apt:
    name: 
      - bubblewrap
    state: latest

- name: Check npm is available
  ansible.builtin.command: npm --version
  changed_when: false

- name: Ensure user-local npm directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ codex_user }}"
    group: "{{ codex_user }}"
    mode: "0755"
  loop:
    - "{{ codex_npm_prefix }}"
    - "{{ codex_bin_dir }}"

- name: Configure npm global prefix for target user
  ansible.builtin.command:
    cmd: "npm config set prefix {{ codex_npm_prefix }}"
  become: true
  become_user: "{{ codex_user }}"
  environment:
    HOME: "{{ codex_user_home }}"
  changed_when: false

- name: Ensure npm global bin directory is on PATH for login shells
  ansible.builtin.blockinfile:
    path: "{{ codex_profile_file }}"
    create: true
    owner: "{{ codex_user }}"
    group: "{{ codex_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - codex cli"
    block: |
      export PATH="{{ codex_bin_dir }}:$PATH"
  when: codex_manage_profile | bool

- name: Install Codex CLI with npm for target user
  ansible.builtin.command:
    cmd: >-
      npm install -g
      {{ codex_package }}{% if codex_version != 'latest' %}@{{ codex_version }}{% endif %}
  become: true
  become_user: "{{ codex_user }}"
  environment:
    HOME: "{{ codex_user_home }}"
    PATH: "{{ codex_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
    npm_config_prefix: "{{ codex_npm_prefix }}"
  register: codex_npm_install
  changed_when: >
    'added ' in codex_npm_install.stdout or
    'changed ' in codex_npm_install.stdout or
    'removed ' in codex_npm_install.stdout or
    'updated ' in codex_npm_install.stdout

- name: Verify codex binary is available
  ansible.builtin.command:
    cmd: "{{ codex_bin_dir }}/codex --version"
  become: true
  become_user: "{{ codex_user }}"
  environment:
    HOME: "{{ codex_user_home }}"
    PATH: "{{ codex_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
